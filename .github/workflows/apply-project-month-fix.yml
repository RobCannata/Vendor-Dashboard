name: Apply project month binding patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-project-month-binding.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-project-month-binding.mjs
      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quick-summary.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix 2026 project month binding"
          git push origin HEAD:main
