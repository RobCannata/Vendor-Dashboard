name: Build dashboard
# Triggered to rebuild the dashboard with the latest ClickUp data and source lists.
# Fresh rebuild trigger: 2026-08-11.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'clickup-data.json'
      - 'index.html'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build dashboard
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: npm run build

      - name: Pull scoped ClickUp data
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/pull-installations-list.mjs

      - name: Post-process Installation Margin labels
        run: node scripts/postprocess-pnl.mjs

      - name: Post-process analytics cards
        run: node scripts/patch-dashboard.mjs

      - name: Restore independent scorecard rendering
        run: node scripts/patch-scorecard-bootstrap.mjs

      - name: Apply live ClickUp scorecards
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/patch-scorecards-live.mjs

      - name: Set DHI score
        run: node scripts/set-dhi-score.mjs

      - name: Publish built dashboard to repo root
        run: |
          cp dist/clickup-data.json clickup-data.json
          cp dist/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clickup-data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update ClickUp data and built dashboard"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 2
            done
          else
            echo "No dashboard changes to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
