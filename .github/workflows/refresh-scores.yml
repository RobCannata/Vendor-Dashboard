name: Refresh ClickUp vendor scores

on:
  push:
    branches: [main, fix/monthly-active-projects, fix/live-vendor-scorecards-merge]
    paths:
      - 'scripts/refresh-scores.mjs'
      - 'scripts/refresh-project-history.mjs'
      - 'scripts/repair-dashboard-state.mjs'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'finance.js'
      - 'quick-summary.js'
      - '.github/workflows/refresh-scores.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clickup-score-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull vendor scores from ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/refresh-scores.mjs
      - name: Refresh 2026 project history
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/refresh-project-history.mjs
      - name: Repair dashboard state
        run: node scripts/repair-dashboard-state.mjs
      - name: Remove duplicate inline project renderer and bump script cache
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('quick-summary.js?v=20260813-1045', 'quick-summary.js?v=20260813-1235')
          s = s.replace('finance.js?v=20260813-1115', 'finance.js?v=20260813-1235')
          s = re.sub(r'\n\s*<script>\s*\(\(\) => \{\s*const YEAR=2026;[\s\S]*?\}\)\(\);\s*</script>', '', s, count=1)
          p.write_text(s)
          PY
      - name: Commit repaired snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clickup-scores.json finance.js quick-summary.js index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "Repair live vendor scorecards and KPI rendering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
