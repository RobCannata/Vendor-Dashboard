name: Refresh ClickUp vendor scores

on:
  push:
    branches: [main, fix/monthly-active-projects]
    paths:
      - 'scripts/refresh-scores.mjs'
      - 'scripts/refresh-project-history.mjs'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'quick-summary.js'
      - '.github/workflows/refresh-scores.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clickup-score-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull vendor scores from ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/refresh-scores.mjs
      - name: Refresh 2026 project history
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
        run: node scripts/refresh-project-history.mjs
      - name: Commit ClickUp snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clickup-scores.json
          if git diff --cached --quiet; then
            echo "No ClickUp snapshot changes."
            exit 0
          fi
          git commit -m "Refresh ClickUp dashboard snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
